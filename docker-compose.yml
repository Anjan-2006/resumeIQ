services:
  redis:
    image: redis:7-alpine
    container_name: resumeiq-redis-service
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - resumeiq-network


  backend-api:
    image: ${DOCKERHUB_USERNAME}/resumeiq-backend:latest
    container_name: resumeiq-backend-api
    restart: unless-stopped

    command: ["npm", "start"]

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    env_file:
      - path: ./.env
        required: false

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=${FRONTEND_URL}

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - resumeiq-network


  backend-worker:
    image: ${DOCKERHUB_USERNAME}/resumeiq-backend:latest
    container_name: resumeiq-backend-worker
    restart: unless-stopped

    command: ["npm", "run", "worker"]

    env_file:
      - path: ./.env
        required: false

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - resumeiq-network


  frontend:
    image: ${DOCKERHUB_USERNAME}/resumeiq-frontend:latest
    container_name: resumeiq-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    depends_on:
      - backend-api

    networks:
      - resumeiq-network


volumes:
  redis_data:


networks:
  resumeiq-network:
    driver: bridge